[project]
name = "dlpdownloader"
version = "1.3.1"
description = "Downloader desktop MVC com PyQt6 e ferramentas portateis"
authors = [
    {name = "Mateus"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "PyQt6>=6.10.2,<7",
]

[project.gui-scripts]
dlpdownloader = "config.bootstrap:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
pytest-qt = ">=4.5,<5"
ruff = ">=0.17,<0.18"
pillow = ">=12.1,<13"
build = ">=1.4,<2"
nuitka = {version = ">=4.3,<4.4", extras = ["onefile"]}
pefile = {version = ">=2024.8.26,<2027", markers = "sys_platform == 'win32'"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
qt_api = "pyqt6"
markers = [
    "externo: exige ferramentas portateis ou Windows real",
    "interface_windows: exige uma sessão interativa do Windows com o plugin Qt windows",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.poetry]
packages = [
    {include = "dlpdownloader.py"},
    {include = "config"},
    {include = "services"},
    {include = "ui"},
]
include = [{path = "ui/resources/flet.png", format = ["sdist", "wheel"]}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
