name: Validar projeto
on: [push, pull_request]
jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install poetry
      - run: python -m poetry install
      - run: python -m poetry run python scripts/verificar.py
      - run: python -m poetry build
  pacote:
    if: startsWith(github.ref, 'refs/tags/')
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install poetry
      - run: python -m poetry install
      - run: python -m poetry run python scripts/preparar_ferramentas.py
      - run: $env:GITHUB_REF_NAME.TrimStart('v') | python -m poetry run python scripts/compilar.py
      - uses: actions/upload-artifact@v4
        with:
          name: DLPDownloader-windows
          path: releases/DLPDownloader-*/
