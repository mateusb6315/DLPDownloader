name: Validar upgrade para Nuitka
on: pull_request
permissions:
  contents: read
jobs:
  upgrade:
    # Checkpoint da migração. Remover após validar o upgrade no PR.
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      DLP_CANDIDATE_VERSION: '1.3.2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install poetry
      - run: python -m poetry install
      - run: python -m poetry run python scripts/preparar_ferramentas.py
      - name: Compilar a release candidata
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            $inno = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -File |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $inno) { throw 'Inno Setup ausente na imagem do runner.' }
            $env:Path = "$($inno.DirectoryName);$env:Path"
          }
          python -m poetry run python scripts/release.py --versao $env:DLP_CANDIDATE_VERSION --zip --destino candidato
      - name: Validar instalação, upgrade e reparador
        shell: powershell
        run: ./.github/scripts/validar-upgrade-nuitka.ps1 -Versao $env:DLP_CANDIDATE_VERSION -Pacote "candidato/DLPDownloader-$env:DLP_CANDIDATE_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Instalador-Nuitka-candidato
          path: candidato/*-setup.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Evidencias-upgrade-Nuitka
          path: ${{ runner.temp }}/dlp-upgrade-evidencias
          retention-days: 7
